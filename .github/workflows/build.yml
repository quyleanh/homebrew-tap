name: Build Bottles

on:
  # Trigger manually from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild all packages (skip version check)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  # Run automatically every 12 hours
  schedule:
    - cron: '13 4 * * *'

  # Run when package definitions or the build pipeline changes
  push:
    paths:
      - "packages.txt"
      - "scripts/**"
      - ".github/workflows/build.yml"
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MACOSX_DEPLOYMENT_TARGET: "13.0"  # Target Ventura (13.0) and above

permissions:
  contents: write  # Required to commit formula updates and manage releases

jobs:
  build:
    name: Build Bottles (macOS Intel / Ventura 13+)
    runs-on: macos-15-intel
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Register checkout as local tap
        run: |
          brew untap quyleanh/tap 2>/dev/null || true
          brew tap --custom-remote quyleanh/tap "${GITHUB_WORKSPACE}"

      - name: Set Homebrew env
        run: |
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_ENV_HINTS=1" >> $GITHUB_ENV

      - name: Update Homebrew
        run: brew update --quiet

      - name: Install dependencies
        run: |
          if ! brew list bash >/dev/null 2>&1; then
            brew install bash
          fi
      
          if ! brew list jq >/dev/null 2>&1; then
            brew install jq
          fi
      
          brew link --overwrite bash || true
          brew link --overwrite jq || true

      - name: Build bottles
        id: build
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: ${{ github.workspace }}/bottles
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
        run: /usr/local/bin/bash scripts/build.sh

      - name: List built bottles
        run: |
          echo "=== Built bottles ==="
          ls -lh bottles/ 2>/dev/null || echo "No new bottles built"

      # Clean release assets orphaned by removed packages (formulae no longer in Formula/)
      - name: Cleanup orphaned release assets
        if: always() && steps.build.outputs.BUILT_COUNT != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_RELEASE_CLEANUP: "true"
        run: /usr/local/bin/bash scripts/cleanup_release.sh

      - name: Summary
        if: always()
        run: |
          built=${{ steps.build.outputs.BUILT_COUNT || '0' }}
          failed=${{ steps.build.outputs.FAILED_COUNT || '0' }}

          if [ "$built" = "0" ] && [ "$failed" = "0" ]; then
            echo "## ⏭️ All packages up to date" >> $GITHUB_STEP_SUMMARY
            echo "No new versions found — nothing to build." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            for f in bottles/*.tar.gz; do
              [ -f "$f" ] || continue
              size=$(du -h "$f" | cut -f1)
              echo "| $(basename $f) | $size |" >> $GITHUB_STEP_SUMMARY
            done
          fi

      - name: Fail if packages failed
        if: always() && steps.build.outputs.FAILED_COUNT != '0'
        run: exit 1
